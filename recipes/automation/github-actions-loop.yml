            "const records = []; const seenIdentity = new Set(); let directoryCount = 0; let inventoryFiles = 0; let inventoryPathBytes = 0; let inventoryFramedBytes = 27; let inventoryContentBytes = 0; let pathBytes = 0; let framedBytes = 27; let contentBytes = 0; const walk = (base, rel = '') => { const handle = fs.opendirSync(path.join(base, rel)); const names = []; let entry; while ((entry = handle.readSync()) !== null) { names.push(entry.name); if (names.length > 4096) throw new Error('bootstrap inventory bound exceeded'); } handle.closeSync(); names.sort((a, b) => Buffer.compare(Buffer.from(a), Buffer.from(b))); directoryCount += 1; if (directoryCount > 4096) throw new Error('bootstrap directory bound exceeded'); for (const name of names) { const child = path.join(base, rel, name); const childRel = rel ? rel + '/' + name : name; if (Buffer.byteLength(childRel) > 4096 || childRel.normalize('NFC') !== childRel || childRel.includes('\\\\') || [...childRel].some(ch => { const code = ch.codePointAt(0); return code <= 0x1f || (code >= 0x7f && code <= 0x9f); })) throw new Error('bootstrap portable path invalid'); const folded = fixedFold(childRel.normalize('NFC')); if (seenPaths.has(childRel) || seenFold.has(folded)) throw new Error('bootstrap path collision'); seenPaths.add(childRel); seenFold.add(folded); const stat = fs.lstatSync(child); if (stat.isSymbolicLink()) throw new Error('bootstrap stage alias'); if (stat.isDirectory()) { if ((stat.mode & 0o777) !== 0o555) throw new Error('bootstrap directory mode invalid'); walk(base, childRel); } else if (stat.isFile()) { const pathLength = Buffer.byteLength(childRel); const frameLength = 16 + pathLength + stat.size; if ((stat.mode & 0o777) !== 0o444 || stat.nlink !== 1 || stat.size > 16 * 1024 * 1024 || inventoryFiles + 1 > 4096 || inventoryPathBytes + pathLength > 16 * 1024 * 1024 || inventoryFramedBytes + frameLength > 512 * 1024 * 1024 || inventoryContentBytes + stat.size > 256 * 1024 * 1024) throw new Error('bootstrap aggregate bound exceeded'); if (seenIdentity.has(`${stat.dev}:${stat.ino}`)) throw new Error('bootstrap file identity alias'); seenIdentity.add(`${stat.dev}:${stat.ino}`); inventoryFiles += 1; inventoryPathBytes += pathLength; inventoryFramedBytes += frameLength; inventoryContentBytes += stat.size; records.push({ rel: childRel, path: child, size: stat.size, dev: stat.dev, ino: stat.ino, mode: stat.mode & 0o777, nlink: stat.nlink }); } else throw new Error('bootstrap special stage entry'); } };",
