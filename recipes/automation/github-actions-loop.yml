          const PUBLIC_ENTRYPOINT_TABLE = Object.freeze([
            Object.freeze({ owner: '.claude-plugin/plugin.json', rel: 'scripts/deep-loop.mjs' }),
            Object.freeze({ owner: '.codex-plugin/plugin.json', rel: 'scripts/deep-loop.mjs' }),
            Object.freeze({ owner: 'package.json', rel: 'scripts/deep-loop.mjs' }),
          ]);
          const TRANSITIVE_RUNTIME_TABLE = Object.freeze([
            Object.freeze({ root: 'scripts', witnesses: Object.freeze(['scripts/deep-loop.mjs', 'scripts/hooks-impl/drive-headless.mjs', 'scripts/lib/headless-host.mjs']) }),
            Object.freeze({ root: 'skills', witnesses: Object.freeze(['skills/deep-loop-continue/SKILL.md', 'skills/deep-loop-resume/SKILL.md', 'skills/deep-loop-workflow/references/adapters.md', 'skills/deep-loop-workflow/references/contracts/HILLCLIMB-001.yaml']) }),
            Object.freeze({ root: 'schemas', witnesses: Object.freeze(['schemas/loop-run.schema.json', 'schemas/review-import.schema.json']) }),
            Object.freeze({ root: 'protocols', witnesses: Object.freeze(['protocols/deep-work.json']) }),
