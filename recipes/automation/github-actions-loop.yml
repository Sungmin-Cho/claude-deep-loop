name: deep-loop
on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 8 * * *"

# Official automation is a provisioned run-A Linux/x64 source-preflight boundary.
# vars.DEEP_LOOP_PROJECT_ROOT and vars.DEEP_LOOP_RUN_ID are captured once from
# init-run and are the canonical project-root/run-id pair; repository RUN_ID,
# DEEP_LOOP_ROOT, and the current hint are never authority. GITHUB_WORKSPACE is
# only the ordinary target checkout workspace and is kept disjoint from the
# persistent project/state and candidate source roots.
#
# Official runner labels are intentionally exact: self-hosted, deep-loop, linux, x64.
# The target checkout may omit plugin scripts because the candidate root is the
# only staged source authority; an invalid candidate stops before child launch.
# No checkout/clean/reset/delete or durable upload/restore is performed here.
#
# Official automation is a provisioned Linux/x64 source-preflight boundary. It
# intentionally has no checkout, cleanup, shell fallback, or runtime fallback.
# The later verified execution stage may invoke drive-headless.mjs only after
# this source identity, target snapshot, and stage-token boundary succeeds.
# External push/PR/merge/publish/delete remains proposal-only and human-approved.
jobs:
  preflight:
    runs-on: [self-hosted, deep-loop, linux, x64]
    timeout-minutes: 35
    steps:
      - name: Trusted staged source preflight
        env:
          DEEP_LOOP_CANDIDATE_ROOT: ${{ vars.DEEP_LOOP_CANDIDATE_ROOT }}
          DEEP_LOOP_STAGE_PARENT: ${{ vars.DEEP_LOOP_STAGE_PARENT }}
          DEEP_LOOP_PROJECT_ROOT: ${{ vars.DEEP_LOOP_PROJECT_ROOT }}
          DEEP_LOOP_CANONICAL_PROJECT_ROOT: ${{ vars.DEEP_LOOP_CANONICAL_PROJECT_ROOT }}
          DEEP_LOOP_RUN_ID: ${{ vars.DEEP_LOOP_RUN_ID }}
          DEEP_LOOP_EXPECTED_PLUGIN_NAME: ${{ vars.DEEP_LOOP_EXPECTED_PLUGIN_NAME }}
          DEEP_LOOP_EXPECTED_PLUGIN_VERSION: ${{ vars.DEEP_LOOP_EXPECTED_PLUGIN_VERSION }}
          DEEP_LOOP_EXPECTED_PLUGIN_SOURCE_SHA256: ${{ vars.DEEP_LOOP_EXPECTED_PLUGIN_SOURCE_SHA256 }}
          DEEP_LOOP_RUN_CHILDREN: "1"
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          import zlib from 'node:zlib';
          import childProcess from 'node:child_process';

