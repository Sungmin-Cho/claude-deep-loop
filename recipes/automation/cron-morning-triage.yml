# deep-loop — unattended morning triage (cron template).
# 무인 장기 실행은 headless 강제 + 측정불가 시 fail-closed (spec §9).
# 안전장치(timeout/usage/fail-closed)는 drive-headless.mjs 가 claude -p 를 감싸 제공한다 — raw claude -p 직접 호출 금지.
# crontab -e 에 붙여넣어 사용. <PROJECT_ROOT>/<DEEP_LOOP_DIR> 를 실제 경로로 치환.
# ONE-TIME PROVISIONING (outside cron): run init-run once, capture its immutable
# <run_id>, and provision PROJECT_ROOT/RUN_ID below. Cron never reads current.
#
# ┌ min  ┌ hour ┌ dom ┌ mon ┌ dow
# 0      8      *     *     *   DEEP_LOOP_UNATTENDED=1 node <DEEP_LOOP_DIR>/scripts/hooks-impl/drive-headless.mjs --project-root "<PROJECT_ROOT>" --run-id "<RUN_ID>" >> deep-loop-cron.log 2>&1
#
# 동작:
#   - provisioned PROJECT_ROOT/RUN_ID 한 개만 headless 로 1 tick 진행 (drive-headless → headlessSpawn(claude -p "/deep-loop-continue")).
#   - budget(turns/tokens/wallclock) 하드캡 + usage 측정불가/timeout 시 fail-closed(비0 종료, 재트리거 전 사람 점검).
#   - 비가역 외부 행동(push/PR/merge/publish)은 v1 에서 proposal-only — cron 이 자동 실행하지 않음.
#   - provisioned RUN_ID가 없거나 잘못되면 routing-invalid/exit 1로 fail-closed; 운영자가 재 provision하고 점검한다. breaker latch 시 사람 reset 전까지 진행 중단.
schedule: "0 8 * * *"
drive: 'node <DEEP_LOOP_DIR>/scripts/hooks-impl/drive-headless.mjs --project-root "<PROJECT_ROOT>" --run-id "<RUN_ID>"'
unattended: true
notes: "drive-headless wraps claude -p with timeout + usage fail-closed; external actions remain proposal-only"
